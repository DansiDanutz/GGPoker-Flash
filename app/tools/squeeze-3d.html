<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DanGG — 3D squeeze rehearsal</title><style>
*{box-sizing:border-box}body{margin:0;background:#11251c;color:#f4e5bf;font:16px system-ui;padding:16px}h1{font-size:21px}canvas{width:100%;height:auto;touch-action:none;display:block;background:radial-gradient(ellipse,#285c40,#142d21);border-radius:16px}input{width:100%;margin:22px 0}button{padding:12px 24px;background:#d0ac60;border:0;border-radius:12px;color:#14231a;font-weight:bold}small{display:block;margin:12px 0}#status{font:13px monospace}main{max-width:650px;margin:auto}</style></head><body><main><h1>DanGG · 3D card squeeze</h1><p>Disposable K♣ / 4♥. Drag upwards to peek; release to relax.</p><canvas width="652" height="484"></canvas><input aria-label="Bend inspection" type="range" min="0" max="60" value="0" step="0.1"><button id="open">Open</button> <button id="reset">Reset</button><small id="status">Loading WebGL…</small></main><script type="module">
import {createSqueeze3D} from '/src/game/squeeze3d.ts';
import {createSqueezeMotion} from '/src/game/squeeze.ts';
const canvas=document.querySelector('canvas'),slider=document.querySelector('input'),status=document.querySelector('#status');
const renderer=await createSqueeze3D(canvas,[10,44],()=>status.textContent='WebGL context lost');
let times=[],motion,start;
function paint(frame){const t=performance.now();renderer.paint(frame);times.push(performance.now()-t);slider.value=frame;status.textContent=`3D · frame ${frame.toFixed(1)} · render ${times.at(-1).toFixed(1)} ms`;}
function reset(){motion?.dispose();motion=createSqueezeMotion(paint,()=>status.textContent+=' · revealed');paint(0);}
reset();slider.oninput=()=>paint(Number(slider.value));
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);start={x:e.clientX,y:e.clientY};};
canvas.onpointermove=e=>{if(start)motion.drag((e.clientX-start.x)*652/canvas.clientWidth,(e.clientY-start.y)*652/canvas.clientWidth);};
canvas.onpointerup=canvas.onpointercancel=()=>{start=null;motion.release();};
document.querySelector('#open').onclick=()=>motion.open();document.querySelector('#reset').onclick=reset;
window.squeezeProof={paint,renderer,times,reset};
window.addEventListener('pagehide',()=>{motion.dispose();renderer.dispose();},{once:true});
</script></body></html>
