  <noscript><section style="padding:24px;color:#fff;font:16px/1.6 system-ui;max-width:720px;margin:auto"><h1>OpenPoker organizer services</h1><p>Enable JavaScript to sign in and check which services are active before paying.</p><h2>Membership pricing</h2><p>Organizer or Contributor membership: $9 per calendar month, explicitly renewed from service credits.</p><p>Cash table setup: $10; active time: $5 per hour charged in advance. Tournament setup: $5; Spin &amp; Go setup: $3; event rescheduling: $1.</p><p>Organizer membership includes 100,000 Cash Chips. Extra 10,000 Cash Chips cost $1 in service credits. These chips are limited to the issuing organizer; demo balances stay separate.</p><p>Service-credit funding is manually verified. Membership activation is separate. Keep payment receipts for Support. External organizer buybacks are not platform payouts.</p><a href="/marketplace" style="color:#efbd63">Open the marketplace</a></section></noscript>
