services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      SERVICES: "1"
      TASKS: "0"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      EVENTS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    security_opt:
      - no-new-privileges:true

  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=admin@dangg.live
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_certs:/letsencrypt
    restart: unless-stopped
    depends_on:
      - socket-proxy
    networks:
      - default
      - socket
    security_opt:
      - no-new-privileges:true

volumes:
  traefik_certs:
    name: crawdbot-worker_traefik_certs
    external: true

networks:
  default:
    name: crawdbot-worker_default
    external: true
  socket:
    name: traefik-socket
    internal: true
