name: dangro

services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        SOURCE_REPOSITORY: ${SOURCE_REPOSITORY:-}
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      GGPOKER_BIND: 0.0.0.0
      GGPOKER_DATA: /data
      GGPOKER_ADMIN_TLS_DIR: /run/operator-tls
      GGPOKER_ADMIN_TLS_PORT: "5197"
      GGPOKER_ADMIN_ORIGIN: https://localhost:5197
    volumes:
      - game-data:/data
      - /etc/dangg/operator-tls:/run/operator-tls:ro
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=crawdbot-worker_default
      - traefik.http.routers.dangro.rule=(Host(`dangg.live`) || Host(`www.dangg.live`)) && !PathPrefix(`/api/admin`)
      - traefik.http.routers.dangro.entrypoints=websecure
      - traefik.http.routers.dangro.tls.certresolver=letsencrypt
      # One year; includeSubDomains deliberately left off until every subdomain is HTTPS-only.
      - traefik.http.routers.dangro.middlewares=dangro-hsts
      - traefik.http.middlewares.dangro-hsts.headers.stsSeconds=31536000
      - traefik.http.routers.dangro-http.rule=(Host(`dangg.live`) || Host(`www.dangg.live`)) && !PathPrefix(`/api/admin`)
      - traefik.http.routers.dangro-http.entrypoints=web
      - traefik.http.routers.dangro-http.middlewares=dangro-redirect
      - traefik.http.middlewares.dangro-redirect.redirectscheme.scheme=https
      - traefik.http.services.dangro.loadbalancer.server.port=5198
    expose:
      - "5198"
    ports:
      - "127.0.0.1:5198:5198"
      - "127.0.0.1:5197:5197"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5198/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  traefik:
    external: true
    name: crawdbot-worker_default

volumes:
  game-data:
