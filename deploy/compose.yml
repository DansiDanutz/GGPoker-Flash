name: dangro

services:
  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GGPOKER_DATA: /data
    volumes:
      - game-data:/data
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=crawdbot-worker_default
      - traefik.http.routers.dangro.rule=Host(`dangg.live`) || Host(`www.dangg.live`)
      - traefik.http.routers.dangro.entrypoints=websecure
      - traefik.http.routers.dangro.tls.certresolver=letsencrypt
      # HSTS starts at one day without includeSubDomains; raise to a year once stable.
      - traefik.http.routers.dangro.middlewares=dangro-hsts
      - traefik.http.middlewares.dangro-hsts.headers.stsSeconds=86400
      - traefik.http.routers.dangro-http.rule=Host(`dangg.live`) || Host(`www.dangg.live`)
      - traefik.http.routers.dangro-http.entrypoints=web
      - traefik.http.routers.dangro-http.middlewares=dangro-redirect
      - traefik.http.middlewares.dangro-redirect.redirectscheme.scheme=https
      - traefik.http.services.dangro.loadbalancer.server.port=5198
    expose:
      - "5198"
    ports:
      - "127.0.0.1:5198:5198"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5198/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  traefik:
    external: true
    name: crawdbot-worker_default

volumes:
  game-data:
