# Independent web/PWA installation. Existing DanGG deployments use ../compose.yml.
name: ${OPENPOKER_PROJECT:-openpoker}

services:
  game:
    image: ${OPENPOKER_PROJECT:-openpoker}-game:${GIT_SHA:?Run tools/openpoker-install.sh init first}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:?A full source commit is required}
        SOURCE_REPOSITORY: ${SOURCE_REPOSITORY:-https://github.com/OpenPoker4all/OpenPoker}
        OPENPOKER_PROFILE: portable
        OPENPOKER_SITE_NAME: ${OPENPOKER_SITE_NAME:-OpenPoker}
        OPENPOKER_SITE_ORIGIN: ${OPENPOKER_SITE_ORIGIN:-http://localhost:5198}
        OPENPOKER_SITE_LOGO: ${OPENPOKER_SITE_LOGO:-}
        OPENPOKER_SITE_ICON: ${OPENPOKER_SITE_ICON:-}
        OPENPOKER_SITE_IMAGE: ${OPENPOKER_SITE_IMAGE:-}
        OPENPOKER_SUPPORT_EMAIL: ${OPENPOKER_SUPPORT_EMAIL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5198"
      GGPOKER_BIND: 0.0.0.0
      GGPOKER_DATA: /data
      GGPOKER_SEED_DEMO: "0"
      GGPOKER_ADMIN_PASSWORD: ${GGPOKER_ADMIN_PASSWORD:?Run tools/openpoker-install.sh init first}
      # The published port is loopback-only. Docker forwards it from its bridge gateway.
      GGPOKER_ADMIN_ALLOW: ${GGPOKER_ADMIN_ALLOW:-127.0.0.1,::1,172.16.0.0/12}
      GGPOKER_ADMIN_ORIGIN: http://localhost:${OPENPOKER_PORT:-5198}
      GGPOKER_PUBLIC_ORIGIN: ${OPENPOKER_SITE_ORIGIN:-http://localhost:5198}
      GGPOKER_TRUST_PROXY: ${GGPOKER_TRUST_PROXY:-0}
      OPENPOKER_PROFILE: portable
      OPENPOKER_SITE_NAME: ${OPENPOKER_SITE_NAME:-OpenPoker}
      OPENPOKER_SITE_ORIGIN: ${OPENPOKER_SITE_ORIGIN:-http://localhost:5198}
      OPENPOKER_SITE_LOGO: ${OPENPOKER_SITE_LOGO:-}
      OPENPOKER_SITE_ICON: ${OPENPOKER_SITE_ICON:-}
      OPENPOKER_SITE_IMAGE: ${OPENPOKER_SITE_IMAGE:-}
      OPENPOKER_SUPPORT_EMAIL: ${OPENPOKER_SUPPORT_EMAIL:-}
    ports:
      - "127.0.0.1:${OPENPOKER_PORT:-5198}:5198"
    volumes:
      - game-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5198/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  game-data:
