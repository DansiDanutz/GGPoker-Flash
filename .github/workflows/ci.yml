name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Electron binary is not needed for server tests, type-checking or the web build.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  # Private integration artifacts identify their actual source repository.
  SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run server tests
        run: node --test server/*.test.js

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Build web client
        run: pnpm run build

      - name: Verify build source and distributed notices
        run: node tools/verify-source-build.mjs

      - name: Verify marketplace in Chrome
        timeout-minutes: 5
        run: node tools/marketplace-browser-smoke.mjs

      - name: Verify organizer chips in Chrome
        timeout-minutes: 3
        run: node tools/organizer-chips-browser-smoke.mjs

      - name: Verify contributor Play Money workflow in Chrome
        timeout-minutes: 3
        run: node tools/contributor-browser-smoke.mjs

      - name: Verify startup and voluntary GitHub consent in Chrome
        timeout-minutes: 3
        run: node tools/startup-star-browser-smoke.mjs

      - name: Verify multi-board visibility and results in Chrome
        timeout-minutes: 3
        run: node tools/run-it-awards-browser-smoke.mjs

      - name: Verify optional squeeze plugin and renderer in Chrome
        timeout-minutes: 4
        run: |
          node tools/squeeze-plugin-browser-smoke.mjs
          node tools/squeeze-3d-browser-smoke.mjs

      - name: Verify populated phone table controls
        timeout-minutes: 4
        run: node tools/table-reference-browser-smoke.mjs

      - name: Verify desktop layouts and multi-board awards
        timeout-minutes: 5
        run: |
          node tools/desktop-table-browser-smoke.mjs
          DESKTOP_TABLE=1 ARTIFACTS_DIR=artifacts/desktop-boards node tools/run-it-awards-browser-smoke.mjs

      - name: Verify table menu commands
        timeout-minutes: 3
        run: node tools/table-menu-browser-smoke.mjs

      - name: Upload marketplace browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-browser-${{ github.run_id }}
          path: |
            app/artifacts/marketplace-browser/
            app/artifacts/startup-star/
            app/artifacts/run-it-awards/
            app/artifacts/squeeze-plugin/
            app/artifacts/squeeze-3d/
            app/artifacts/table-reference/
            app/artifacts/table-menu/
            app/artifacts/desktop-table/
            app/artifacts/desktop-boards/
          if-no-files-found: ignore
          retention-days: 7
